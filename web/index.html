<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>UGM Mobility — trace inspector</title>
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="map"></div>

  <div id="panel">
    <h1>Mobility traces — <span id="day"></span></h1>
    <p class="note">GPS-spike filtered (<span id="filter-note"></span>). Toggle devices; click a dot for time &amp; speed; drag the slider / press Play to animate.</p>

    <div id="devices"></div>

    <hr>
    <div id="time-control">
      <button id="play" title="animate all visible traces">▶ Play</button>
      <input id="slider" type="range" min="0" max="1000" value="0">
      <span id="clock">--:--:--</span>
    </div>
    <button id="fit">⤢ Fit all traces</button>
    <p class="foot">Village boundaries: DIY (batas desa). Generated by
      <code>scripts/export_traces_web.py</code>.</p>
  </div>

  <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
  <script src="main.js"></script>
</body>
</html>
