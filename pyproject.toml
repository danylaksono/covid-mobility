[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ugm-mobility"
version = "0.1.0"
description = "UGM Yogyakarta GPS mobility analysis (COVID-19) — processing pipeline"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "pandas",
    "geopandas",
    "shapely",
    "pyarrow",
    "duckdb",
    "h3",
    "matplotlib",
    "palettable",
]

[project.optional-dependencies]
maps = ["lonboard", "leafmap"]  # optional interactive maps (not required for the pipeline)

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"
